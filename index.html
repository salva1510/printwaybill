<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindahan POS — Fast Sales & Waybill</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:'JetBrains Mono',monospace}@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:absolute;left:0;top:0;width:100%}}</style>
</head>
<body class="bg-[#fafafa] text-zinc-900"><div id="app"></div>
<script>
const STORE_KEY='tindahan_v2_products',WAYBILL_KEY='tindahan_v2_waybills',SETTINGS_KEY='tindahan_v2_settings';
const defaultProducts=[{id:'1',name:'Oversized Tee - Black',price:350,stock:42,sku:'TEE-BLK',emoji:'👕'},{id:'2',name:'Cargo Shorts',price:499,stock:18,sku:'SHORT-KHK',emoji:'🩳'},{id:'3',name:'Cap Gray',price:250,stock:30,sku:'CAP-GRY',emoji:'🧢'}];
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{"storeName":"Tindahan POS","address":"Quezon City, PH","phone":"0917-xxx-xxxx","courier":"J&T Express","receiptFooter":"Maraming salamat!"}');
let products=JSON.parse(localStorage.getItem(STORE_KEY)||JSON.stringify(defaultProducts));
let waybills=JSON.parse(localStorage.getItem(WAYBILL_KEY)||'[]');let cart=[],activeTab='pos',cartCustomer={name:'',phone:'',address:''},editingProduct=null,showReceipt=null,showWaybillPrint=null,showWaybillForm=false,waybillForm={orderId:'OD-'+Math.random().toString(36).substr(2,6).toUpperCase(),receiverName:'',receiverPhone:'',receiverAddr:'',courier:settings.courier,cod:0,weight:'0.5kg',itemDesc:'',qty:1,tracking:'JT'+Math.floor(Math.random()*9e9+1e9)},searchQ='';
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(products));localStorage.setItem(WAYBILL_KEY,JSON.stringify(waybills));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));render()}
function total(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function render(){document.getElementById('app').innerHTML=`<div class="min-h-screen flex"><div class="hidden md:flex w-[260px] bg-white border-r flex-col p-4 sticky top-0 h-screen"><div class="flex gap-3 px-2 py-3"><div class="w-9 h-9 bg-black text-white rounded-xl grid place-items-center font-black">T</div><div><div class="font-bold">${settings.storeName}</div><div class="text-[11px] text-zinc-500">Fast Sales & Receipts</div></div></div><nav class="mt-6 space-y-1">${[['pos','POS'],['products','Products'],['waybills','Waybills'],['settings','Settings']].map(([k,l])=>`<button onclick="activeTab='${k}';render()" class="w-full text-left px-3 py-2.5 rounded-xl text-[14px] font-medium ${activeTab===k?'bg-black text-white':'hover:bg-zinc-100'}">${l}${k==='pos'&&cart.length?` (${cart.length})`:''}</button>`).join('')}</nav><div class="mt-auto p-3 bg-zinc-900 rounded-2xl text-white text-[12px]">GitHub Ready - Unli edit, localStorage only</div></div><div class="flex-1"><div class="max-w-[1400px] mx-auto p-4 md:p-6">${activeTab==='pos'?renderPOS():activeTab==='products'?renderProducts():activeTab==='waybills'?renderWaybills():renderSettings()}</div></div></div>${showReceipt?renderReceipt():''}${showWaybillPrint?renderWBPrint():''}${showWaybillForm?renderWBForm():''}<div id="print-area" class="hidden"></div>`}
function renderPOS(){const f=products.filter(p=>p.name.toLowerCase().includes(searchQ.toLowerCase()));return`<div class="grid lg:grid-cols-[1fr_380px] gap-6"><div><h1 class="text-[22px] font-bold mb-4">Tindahan POS</h1><input oninput="searchQ=this.value;render()" value="${searchQ}" placeholder="Search..." class="w-full bg-white border rounded-xl px-4 py-2.5 text-sm mb-4"><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${f.map(p=>`<div class="bg-white border rounded-[18px] p-3"><div class="bg-zinc-50 rounded-[14px] aspect-[1.2] grid place-items-center text-4xl">${p.emoji}</div><div class="font-semibold text-[14px] mt-2">${p.name}</div><div class="flex justify-between mt-2"><b>₱${p.price}</b><button onclick="cart.find(x=>x.id==='${p.id}')?cart.find(x=>x.id==='${p.id}').qty++:cart.push({...products.find(x=>x.id==='${p.id}'),qty:1});render()" class="bg-black text-white px-3 py-1 rounded-full text-xs">+ Add</button></div></div>`).join('')}</div></div><div class="bg-white border rounded-[22px] p-4 h-fit lg:sticky top-6"><div class="font-bold">Cart ${cart.length}</div><div class="mt-3 space-y-2">${cart.map((c,i)=>`<div class="flex justify-between text-sm"><span>${c.name} x${c.qty}</span><span><button onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);render()" class="border w-6 h-6 rounded-full">-</button> <button onclick="cart[${i}].qty++;render()" class="border w-6 h-6 rounded-full">+</button></span></div>`).join('')||'Empty'}</div><input oninput="cartCustomer.name=this.value" value="${cartCustomer.name}" placeholder="Customer Name" class="w-full border rounded-xl px-3 py-2.5 text-sm mt-4"><input oninput="cartCustomer.phone=this.value" value="${cartCustomer.phone}" placeholder="Phone" class="w-full border rounded-xl px-3 py-2.5 text-sm mt-2"><input oninput="cartCustomer.address=this.value" value="${cartCustomer.address}" placeholder="Address" class="w-full border rounded-xl px-3 py-2.5 text-sm mt-2"><div class="mt-3 bg-zinc-50 rounded-xl p-3 flex justify-between font-bold"><span>Total</span><span>₱${total()}</span></div><button onclick="showReceipt=cart;cart=[];save()" class="w-full bg-black text-white py-3 rounded-xl mt-3 font-semibold text-sm">Checkout & Print Receipt</button><button onclick="waybillForm.receiverName=cartCustomer.name;waybillForm.receiverPhone=cartCustomer.phone;waybillForm.receiverAddr=cartCustomer.address;waybillForm.itemDesc=cart.map(c=>c.name).join(', ');showWaybillForm=true;render()" class="w-full border border-black py-3 rounded-xl mt-2 font-semibold text-sm">Create Waybill</button></div></div>`}
function renderProducts(){return`<div class="flex justify-between mb-4"><h1 class="font-bold text-xl">Products</h1><button onclick="editingProduct={name:'',price:'',sku:'',emoji:'📦',_new:true};render()" class="bg-black text-white px-4 py-2 rounded-xl text-sm">+ Add</button></div><div class="bg-white border rounded-xl divide-y">${products.map(p=>`<div class="p-3 flex justify-between text-sm"><span>${p.emoji} ${p.name} - ₱${p.price}</span><span><button onclick="editingProduct={...products.find(x=>x.id==='${p.id}')};render()" class="border px-2 rounded-full">Edit</button> <button onclick="products=products.filter(x=>x.id!=='${p.id}');save()" class="bg-black text-white px-2 rounded-full">Del</button></span></div>`).join('')}</div>${editingProduct?`<div class="fixed inset-0 bg-black/40 z-20 grid place-items-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><b>${editingProduct._new?'Add':'Edit'} Product</b><input id="pn" value="${editingProduct.name}" placeholder="Name" class="w-full border rounded-xl px-3 py-2 mt-3"><input id="pp" value="${editingProduct.price}" placeholder="Price" type="number" class="w-full border rounded-xl px-3 py-2 mt-2"><input id="ps" value="${editingProduct.emoji}" placeholder="Emoji" class="w-full border rounded-xl px-3 py-2 mt-2"><button onclick="if(document.getElementById('pn').value){if(editingProduct._new)products.unshift({id:Date.now()+'',name:document.getElementById('pn').value,price:+document.getElementById('pp').value,emoji:document.getElementById('ps').value,sku:'SKU'});else{let i=products.findIndex(x=>x.id===editingProduct.id);products[i].name=document.getElementById('pn').value;products[i].price=+document.getElementById('pp').value;products[i].emoji=document.getElementById('ps').value}editingProduct=null;save()}" class="w-full bg-black text-white py-2 rounded-xl mt-3">Save</button></div></div>`:''}`}
function renderWaybills(){return`<div class="flex justify-between mb-4"><h1 class="font-bold text-xl">Waybills</h1><button onclick="waybillForm={orderId:'OD-'+Math.random().toString(36).substr(2,6).toUpperCase(),tracking:'JT'+Math.floor(Math.random()*9e9+1e9),courier:settings.courier,receiverName:'',receiverPhone:'',receiverAddr:'',itemDesc:'',qty:1,cod:0,weight:'0.5kg'};showWaybillForm=true;render()" class="bg-black text-white px-4 py-2 rounded-xl text-sm">+ New</button></div><div class="grid md:grid-cols-2 gap-3">${waybills.map((w,i)=>`<div class="bg-white border rounded-2xl p-4"><div class="flex justify-between"><b class="mono text-sm">${w.tracking}</b><span class="text-xs bg-black text-white px-2 py-1 rounded-full">${w.cod>0?'COD ₱'+w.cod:'Non-COD'}</span></div><div class="text-sm mt-2">To: ${w.receiverName}<br>${w.receiverAddr}</div><div class="flex gap-2 mt-3"><button onclick="showWaybillPrint=waybills[${i}];render()" class="flex-1 bg-black text-white py-2 rounded-xl text-sm">Print</button><button onclick="waybills.splice(${i},1);save()" class="border px-3 py-2 rounded-xl text-sm">Del</button></div></div>`).join('')||'No waybills'}</div>`}
function renderSettings(){return`<h1 class="font-bold text-xl mb-4">Settings</h1><div class="bg-white border rounded-2xl p-5 space-y-3"><input oninput="settings.storeName=this.value;save()" value="${settings.storeName}" class="w-full border rounded-xl px-3 py-2"><input oninput="settings.address=this.value;save()" value="${settings.address}" class="w-full border rounded-xl px-3 py-2"><input oninput="settings.phone=this.value;save()" value="${settings.phone}" class="w-full border rounded-xl px-3 py-2"><button onclick="localStorage.clear();location.reload()" class="w-full bg-red-50 text-red-600 py-2 rounded-xl text-sm">Reset</button></div>`}
function renderReceipt(){return`<div class="fixed inset-0 bg-black/50 z-50 grid place-items-center p-4"><div class="bg-white rounded-2xl w-full max-w-[360px] overflow-hidden"><div id="receipt" class="p-6 mono text-xs"><div class="text-center border-b border-dashed pb-3"><b class="text-[16px]">${settings.storeName}</b><div>${settings.address}</div></div><div class="py-3">${showReceipt.map(i=>`<div class="flex justify-between"><span>${i.name} x${i.qty}</span><span>₱${i.price*i.qty}</span></div>`).join('')}</div><div class="border-t border-dashed pt-3 flex justify-between font-bold"><span>TOTAL</span><span>₱${showReceipt.reduce((s,i)=>s+i.price*i.qty,0)}</span></div></div><div class="p-3 grid grid-cols-2 gap-2"><button onclick="let el=document.getElementById('receipt');let pa=document.getElementById('print-area');pa.innerHTML=el.outerHTML;pa.classList.remove('hidden');window.print();pa.classList.add('hidden')" class="bg-black text-white py-2 rounded-xl text-sm">Print</button><button onclick="showReceipt=null;render()" class="border py-2 rounded-xl text-sm">Close</button></div></div></div>`}
function renderWBPrint(){const w=showWaybillPrint;return`<div class="fixed inset-0 bg-black/50 z-50 grid place-items-center p-4"><div class="bg-white rounded-xl w-full max-w-[500px]"><div id="waybill" class="p-5"><div class="flex justify-between"><b>${w.courier}</b><span class="bg-black text-white px-3 py-1 rounded-full text-xs">${w.cod>0?'COD':'NON-COD'}</span></div><div class="border-2 border-black rounded-xl p-3 text-center mt-4"><div class="mono text-xs tracking-widest">${w.tracking}</div><div class="h-[40px] mt-2 flex gap-[2px] justify-center">${w.tracking.split('').map((c,i)=>`<div style="width:${c.charCodeAt(0)%3+2}px" class="${i%2?'bg-white':'bg-black'}"></div>`).join('')}</div></div><div class="grid grid-cols-2 gap-3 mt-4 text-xs"><div class="border rounded-xl p-3"><div class="text-[10px] text-zinc-500">FROM</div><b>${settings.storeName}</b><div>${settings.address}</div></div><div class="border rounded-xl p-3 bg-zinc-50"><div class="text-[10px] text-zinc-500">TO</div><b>${w.receiverName}</b><div>${w.receiverPhone}</div><div>${w.receiverAddr}</div></div></div><div class="border rounded-xl p-3 mt-3 flex justify-between text-xs"><span>${w.orderId} ${w.itemDesc} x${w.qty}</span><b class="text-base">₱${w.cod}</b></div></div><div class="p-3 grid grid-cols-2 gap-2"><button onclick="let el=document.getElementById('waybill');let pa=document.getElementById('print-area');pa.innerHTML=el.outerHTML;pa.classList.remove('hidden');window.print();pa.classList.add('hidden')" class="bg-black text-white py-3 rounded-xl text-sm">Print Waybill</button><button onclick="showWaybillPrint=null;render()" class="border py-3 rounded-xl text-sm">Close</button></div></div></div>`}
function renderWBForm(){return`<div class="fixed inset-0 bg-black/50 z-50 grid place-items-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><b>New Waybill</b><input id="wb_t" value="${waybillForm.tracking}" class="w-full border rounded-xl px-3 py-2 mt-3 text-sm" placeholder="Tracking"><input id="wb_n" value="${waybillForm.receiverName}" class="w-full border rounded-xl px-3 py-2 mt-2 text-sm" placeholder="Receiver"><input id="wb_p" value="${waybillForm.receiverPhone}" class="w-full border rounded-xl px-3 py-2 mt-2 text-sm" placeholder="Phone"><input id="wb_a" value="${waybillForm.receiverAddr}" class="w-full border rounded-xl px-3 py-2 mt-2 text-sm" placeholder="Address"><div class="grid grid-cols-2 gap-2 mt-2"><input id="wb_c" value="${waybillForm.cod}" type="number" placeholder="COD" class="border rounded-xl px-3 py-2 text-sm"><input id="wb_i" value="${waybillForm.itemDesc}" placeholder="Items" class="border rounded-xl px-3 py-2 text-sm"></div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="waybills.unshift({tracking:document.getElementById('wb_t').value,receiverName:document.getElementById('wb_n').value,receiverPhone:document.getElementById('wb_p').value,receiverAddr:document.getElementById('wb_a').value,cod:+document.getElementById('wb_c').value,itemDesc:document.getElementById('wb_i').value,orderId:waybillForm.orderId,courier:settings.courier,qty:1,weight:'0.5kg'});showWaybillForm=false;save()" class="bg-black text-white py-3 rounded-xl text-sm">Save</button><button onclick="showWaybillForm=false;render()" class="border py-3 rounded-xl text-sm">Cancel</button></div></div></div>`}
render();
</script></body></html>
