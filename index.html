<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindahan POS — Fast Sales & Receipts | Print Waybill</title>
<meta name="description" content="Tindahan POS + Waybill Printer - Pang Shopee, TikTok, Lazada sellers. Print 100x150mm">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.8.0/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%;margin:0;padding:0}
  @page{margin:0}
}
.scrollbar-hide::-webkit-scrollbar{display:none}
</style>
</head>
<body class="bg-[#f6f6f5] text-zinc-900 antialiased">
<div id="app"></div>
<div id="print-area" class="hidden"></div>

<script>
// Storage keys
const K = {products:'td_products_v3', waybills:'td_waybills_v3', settings:'td_settings_v3'};
const defaults = {
  products:[
    {id:'p1',name:'Oversized Tee Black',price:350,stock:42,sku:'TEE-BLK-001',emoji:'👕',cat:'Apparel'},
    {id:'p2',name:'Cargo Shorts Khaki',price:499,stock:18,sku:'SHORT-KHK',emoji:'🩳',cat:'Apparel'},
    {id:'p3',name:'Cap Washed Gray',price:250,stock:30,sku:'CAP-GRY',emoji:'🧢',cat:'Accessories'},
    {id:'p4',name:'Tote Bag Canvas',price:180,stock:55,sku:'TOTE-001',emoji:'👜',cat:'Bags'},
    {id:'p5',name:'Socks Pack 3pcs',price:150,stock:100,sku:'SOCK-3',emoji:'🧦',cat:'Accessories'},
    {id:'p6',name:'Hoodie Cream',price:750,stock:12,sku:'HOOD-CRM',emoji:'🧥',cat:'Apparel'},
  ],
  settings:{storeName:'Tindahan POS',address:'Quezon City, Metro Manila, PH',phone:'0917-123-4567',courier:'J&T Express',receiptFooter:'Maraming salamat! Balik ka ulit!',logo:''}
};

let settings = JSON.parse(localStorage.getItem(K.settings)||JSON.stringify(defaults.settings));
let products = JSON.parse(localStorage.getItem(K.products)||JSON.stringify(defaults.products));
let waybills = JSON.parse(localStorage.getItem(K.waybills)||'[]');
let cart=[], active='pos', cust={name:'',phone:'',address:''}, q='', editProd=null, receipt=null, wbPrint=null, wbFormOpen=false;
let wbForm={orderId:'OD-'+Math.random().toString(36).slice(2,8).toUpperCase(),tracking:'JT'+Math.floor(Math.random()*9000000000+1000000000),courier:settings.courier,receiverName:'',receiverPhone:'',receiverAddr:'',itemDesc:'',qty:1,cod:0,weight:'0.5 kg',note:''};

function save(){localStorage.setItem(K.products,JSON.stringify(products));localStorage.setItem(K.waybills,JSON.stringify(waybills));localStorage.setItem(K.settings,JSON.stringify(settings));render();}
function total(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}

function render(){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex">
    <aside class="hidden lg:flex w-[280px] bg-white border-r border-zinc-200 flex-col p-5 sticky top-0 h-screen">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-black text-white grid place-items-center font-black text-[18px]">T</div>
        <div><div class="font-bold leading-none">${settings.storeName}</div><div class="text-[11px] text-zinc-500 mt-1 tracking-wide uppercase">Fast Sales & Receipts</div></div>
      </div>
      <nav class="mt-8 space-y-1.5">
        ${[['pos','POS Terminal','◫',cart.length],['products','Products','⊞',products.length],['waybills','Waybills','⛟',waybills.length],['settings','Settings','⚙',null]].map(([k,l,ic,b])=>`
          <button onclick="active='${k}';render()" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-[14px] font-medium transition ${active===k?'bg-zinc-900 text-white shadow-sm':'text-zinc-600 hover:bg-zinc-100'}">
            <span class="text-[15px]">${ic}</span>${l}${b?`<span class="ml-auto text-[11px] px-2 py-0.5 rounded-full font-bold ${active===k?'bg-white text-black':'bg-zinc-100'}">${b}</span>`:''}
          </button>`).join('')}
      </nav>
      <div class="mt-auto space-y-3">
        <div class="p-4 rounded-2xl bg-[#111] text-white">
          <div class="text-[13px] font-semibold">Ready for GitHub Pages?</div>
          <div class="text-[11px] text-zinc-400 mt-1 leading-relaxed">One file lang ito. I-push mo sa GitHub, enable Pages, live ka na. Unli edit kahit sa phone.</div>
          <button onclick="showGitModal=true;render()" class="mt-3 w-full bg-white text-black py-2.5 rounded-xl text-[12px] font-bold">Paano i-upload →</button>
        </div>
        <div class="text-[10px] text-zinc-400 text-center">v3 • localStorage only • No backend</div>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <div class="lg:hidden sticky top-0 z-30 bg-white/80 backdrop-blur border-b flex items-center justify-between p-3">
        <div class="font-bold text-sm">${settings.storeName}</div>
        <div class="flex gap-1.5">${['pos','products','waybills','settings'].map(k=>`<button onclick="active='${k}';render()" class="px-3.5 py-2 rounded-full text-[11px] font-bold uppercase ${active===k?'bg-black text-white':'bg-zinc-100'}">${k}</button>`).join('')}</div>
      </div>
      <div class="max-w-[1440px] mx-auto p-4 lg:p-8">
        ${active==='pos'?posView():active==='products'?prodView():active==='waybills'?wbListView():settingsView()}
      </div>
    </main>
  </div>
  ${receipt?receiptModal():''}
  ${wbPrint?wbPrintModal():''}
  ${wbFormOpen?wbFormModal():''}
  ${typeof showGitModal!=='undefined'&&showGitModal?gitModal():''}
  `;
  setTimeout(initBarcodes,100);
}

function posView(){
  const filtered = products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.sku.toLowerCase().includes(q.toLowerCase()));
  return `
  <div class="grid grid-cols-1 xl:grid-cols-[1fr_400px] gap-6">
    <div>
      <div class="flex items-end justify-between gap-4 mb-5">
        <div><h1 class="text-[26px] font-extrabold tracking-tight leading-none">Tindahan POS</h1><p class="text-[13px] text-zinc-500 mt-2">Fast Sales & Receipts • Print Waybill 100x150mm</p></div>
        <div class="hidden md:flex items-center gap-2 text-[11px] text-zinc-500"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Local mode</div>
      </div>
      <div class="flex gap-2 mb-5">
        <div class="flex-1 relative"><input value="${q}" oninput="q=this.value;render()" placeholder="Search products, SKU..." class="w-full bg-white border border-zinc-200 rounded-full pl-11 pr-4 py-3 text-[14px] outline-none focus:border-black"><span class="absolute left-4 top-3.5 text-zinc-400">⌕</span></div>
        <select onchange="filterCat=this.value;render()" class="bg-white border rounded-full px-4 py-3 text-sm"><option>All</option><option>Apparel</option><option>Accessories</option><option>Bags</option></select>
      </div>
      ${filtered.length===0?`<div class="bg-white border-2 border-dashed border-zinc-200 rounded-[24px] p-16 text-center"><div class="text-5xl">📦</div><h3 class="font-bold mt-4">No products yet</h3><p class="text-sm text-zinc-500 mt-1">Add your own products to start selling.</p><button onclick="active='products';render()" class="mt-5 bg-black text-white px-5 py-2.5 rounded-full text-sm font-bold">Add Product</button></div>`:
      `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${filtered.map(p=>`
        <div class="group bg-white border border-zinc-200 rounded-[20px] p-3 hover:shadow-[0_8px_30px_rgba(0,0,0,0.06)] hover:border-zinc-300 transition">
          <div class="aspect-[4/3] bg-[#fafafa] rounded-[16px] grid place-items-center text-[40px] relative overflow-hidden">${p.emoji}<span class="absolute bottom-2 right-2 text-[10px] bg-white border px-2 py-1 rounded-full mono">${p.stock} left</span></div>
          <div class="mt-3 px-1"><div class="font-semibold text-[13.5px] leading-tight line-clamp-2">${p.name}</div><div class="mono text-[11px] text-zinc-500 mt-1">${p.sku}</div><div class="flex items-center justify-between mt-3"><div class="font-bold">₱${p.price}</div><button onclick="addCart('${p.id}')" class="bg-black text-white w-8 h-8 rounded-full grid place-items-center font-bold group-hover:scale-105 transition">+</button></div></div>
        </div>`).join('')}</div>`}
    </div>

    <div class="bg-white border border-zinc-200 rounded-[24px] p-5 h-fit xl:sticky xl:top-8 shadow-[0_10px_40px_rgba(0,0,0,0.04)]">
      <div class="flex items-center justify-between"><div class="font-bold">Cart • ${cart.length} items</div><button onclick="cart=[];render()" class="text-[11px] text-zinc-500 hover:text-black">Clear</button></div>
      <div class="mt-4 max-h-[300px] overflow-auto scrollbar-hide divide-y">${cart.length?cart.map((c,i)=>`
        <div class="flex gap-3 py-3"><div class="w-10 h-10 bg-zinc-50 rounded-xl grid place-items-center text-lg">${c.emoji}</div><div class="flex-1 min-w-0"><div class="text-[13px] font-medium truncate">${c.name}</div><div class="text-[11px] text-zinc-500">₱${c.price} x ${c.qty} = <b class="text-zinc-900">₱${c.price*c.qty}</b></div></div><div class="flex items-center gap-1"><button onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);render()" class="w-7 h-7 rounded-full border hover:bg-zinc-50">−</button><span class="w-5 text-center text-xs font-bold">${c.qty}</span><button onclick="cart[${i}].qty++;render()" class="w-7 h-7 rounded-full border hover:bg-zinc-50">+</button></div></div>`).join(''):`<div class="py-16 text-center"><div class="text-3xl">🛒</div><div class="text-[13px] text-zinc-500 mt-2">Cart is empty<br>Add products from left</div></div>`}</div>

      <div class="border-t border-dashed mt-2 pt-5 space-y-2.5">
        <div class="text-[11px] font-bold uppercase tracking-wider text-zinc-500">Customer / Waybill Details</div>
        <input id="c_name" value="${cust.name}" oninput="cust.name=this.value" placeholder="Full Name *" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3.5 py-3 text-[13px] outline-none focus:bg-white focus:border-black">
        <div class="grid grid-cols-2 gap-2"><input id="c_phone" value="${cust.phone}" oninput="cust.phone=this.value" placeholder="Phone *" class="bg-zinc-50 border rounded-xl px-3.5 py-3 text-[13px] outline-none focus:bg-white"><input id="c_cod" value="${wbForm.cod||''}" oninput="wbForm.cod=this.value" placeholder="COD ₱ (optional)" type="number" class="bg-zinc-50 border rounded-xl px-3.5 py-3 text-[13px] outline-none focus:bg-white"></div>
        <textarea id="c_addr" oninput="cust.address=this.value" placeholder="Complete Address * - Barangay, City, Province" class="w-full bg-zinc-50 border rounded-xl px-3.5 py-3 text-[13px] outline-none focus:bg-white h-[70px] resize-none">${cust.address}</textarea>

        <div class="bg-zinc-900 text-white rounded-xl p-4 mt-2"><div class="flex justify-between text-[12px] text-zinc-400"><span>Subtotal</span><span>₱${total()}</span></div><div class="flex justify-between font-bold text-[16px] mt-1"><span>Total</span><span>₱${total()}</span></div><div class="text-[10px] text-zinc-500 mt-2">Shipping fee excluded. Add COD if needed.</div></div>

        <button onclick="doReceipt()" ${!cart.length?'disabled':''} class="w-full bg-black text-white py-3.5 rounded-xl font-bold text-[14px] disabled:opacity-30 mt-1">Checkout & Print Receipt 🧾</button>
        <button onclick="openWBFromCart()" ${!cart.length?'disabled':''} class="w-full bg-white border-2 border-black text-black py-3.5 rounded-xl font-bold text-[14px] disabled:opacity-30">Create Waybill & Print ⛟</button>
        <div class="text-[10px] text-center text-zinc-400">Thermal 58/80mm receipt • 100x150mm waybill sticker</div>
      </div>
    </div>
  </div>`;
}

function prodView(){
  return `<div><div class="flex items-center justify-between mb-6"><h1 class="text-[24px] font-extrabold">Products • ${products.length}</h1><div class="flex gap-2"><button onclick="exportData()" class="bg-white border px-4 py-2.5 rounded-full text-sm font-medium">Export JSON</button><button onclick="editProd={name:'',price:'',sku:'',emoji:'📦',stock:10,cat:'Apparel',_new:true};render()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-bold">+ Add Product</button></div></div><div class="bg-white border rounded-[20px] overflow-hidden"><div class="hidden md:grid grid-cols-12 px-5 py-3 bg-zinc-50 text-[11px] font-bold uppercase tracking-wider text-zinc-500"><div class="col-span-6">Product</div><div class="col-span-2">SKU</div><div class="col-span-2">Price</div><div class="col-span-2 text-right">Action</div></div>${products.map(p=>`<div class="grid grid-cols-12 items-center px-5 py-4 border-t text-sm hover:bg-zinc-50/50"><div class="col-span-8 md:col-span-6 flex items-center gap-3"><div class="w-10 h-10 bg-zinc-50 rounded-xl grid place-items-center">${p.emoji}</div><div><div class="font-semibold">${p.name}</div><div class="text-xs text-zinc-500 md:hidden">${p.sku} • ₱${p.price}</div></div></div><div class="hidden md:block col-span-2 mono text-xs">${p.sku}</div><div class="hidden md:block col-span-2 font-bold">₱${p.price}</div><div class="col-span-4 md:col-span-2 flex justify-end gap-1.5"><button onclick="editProd={...products.find(x=>x.id==='${p.id}')};render()" class="w-8 h-8 rounded-full border grid place-items-center">✎</button><button onclick="if(confirm('Delete?')){products=products.filter(x=>x.id!=='${p.id}');save()}" class="w-8 h-8 rounded-full bg-black text-white grid place-items-center">✕</button></div></div>`).join('')}</div>${editProd?prodModal():''}</div>`;
}

function prodModal(){
  return `<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 grid place-items-center p-4" onclick="if(event.target===this){editProd=null;render()}"><div class="bg-white rounded-[24px] p-7 w-full max-w-[420px]"><div class="font-bold text-lg">${editProd._new?'Add Product':'Edit Product'}</div><div class="mt-5 space-y-3"><input id="pn" value="${editProd.name||''}" placeholder="Product name" class="w-full border rounded-xl px-4 py-3 text-sm"><div class="grid grid-cols-2 gap-3"><input id="pp" value="${editProd.price||''}" type="number" placeholder="Price ₱" class="border rounded-xl px-4 py-3 text-sm"><input id="ps" value="${editProd.stock||''}" type="number" placeholder="Stock" class="border rounded-xl px-4 py-3 text-sm"></div><div class="grid grid-cols-2 gap-3"><input id="psku" value="${editProd.sku||''}" placeholder="SKU" class="border rounded-xl px-4 py-3 text-sm"><input id="pemo" value="${editProd.emoji||''}" placeholder="Emoji" class="border rounded-xl px-4 py-3 text-sm"></div><select id="pcat" class="w-full border rounded-xl px-4 py-3 text-sm"><option>Apparel</option><option>Accessories</option><option>Bags</option><option>Other</option></select><button onclick="saveProd()" class="w-full bg-black text-white py-3.5 rounded-xl font-bold mt-2">Save Product</button><button onclick="editProd=null;render()" class="w-full py-2 text-sm text-zinc-500">Cancel</button></div></div></div>`;
}

function wbListView(){
  return `<div><div class="flex items-center justify-between mb-6"><h1 class="text-[24px] font-extrabold">Waybills • ${waybills.length}</h1><button onclick="newWB()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-bold">+ New Waybill</button></div>${waybills.length===0?`<div class="bg-white border-2 border-dashed rounded-[24px] p-16 text-center"><div class="text-5xl">⛟</div><div class="font-bold mt-4">No waybills yet</div><div class="text-sm text-zinc-500">Create from POS or manually. Print in 100x150mm.</div></div>`:`<div class="grid md:grid-cols-2 gap-4">${waybills.map((w,i)=>`<div class="bg-white border rounded-[20px] p-5 hover:shadow-sm"><div class="flex justify-between items-start"><div><div class="mono font-bold text-[13px]">${w.tracking}</div><div class="text-[11px] text-zinc-500 mt-0.5">${w.courier} • ${w.orderId}</div></div><div class="px-2.5 py-1 rounded-full text-[11px] font-bold ${w.cod>0?'bg-black text-white':'bg-zinc-100'}">${w.cod>0?'COD ₱'+w.cod:'NON-COD'}</div></div><div class="mt-4 text-[13px] leading-snug"><div class="font-semibold">To: ${w.receiverName} • ${w.receiverPhone}</div><div class="text-zinc-600 text-[12px] mt-1 line-clamp-2">${w.receiverAddr}</div><div class="text-[11px] mt-2 bg-zinc-50 border rounded-full px-3 py-1.5 inline-block">${w.itemDesc} x${w.qty} • ${w.weight}</div></div><div class="flex gap-2 mt-5"><button onclick="wbPrint=waybills[${i}];render()" class="flex-1 bg-black text-white py-2.5 rounded-xl text-sm font-bold">Print</button><button onclick="dupWB(${i})" class="px-4 py-2.5 border rounded-xl text-sm">Duplicate</button><button onclick="if(confirm('Delete?')){waybills.splice(${i},1);save()}" class="px-4 py-2.5 border rounded-xl text-sm">Del</button></div></div>`).join('')}</div>`}</div>`;
}

function settingsView(){
  return `<div><h1 class="text-[24px] font-extrabold mb-6">Settings</h1><div class="grid md:grid-cols-2 gap-6"><div class="bg-white border rounded-[24px] p-6"><div class="font-bold mb-4">Store Info (Sender)</div><div class="space-y-3"><label class="text-[11px] font-bold uppercase text-zinc-500">Store Name</label><input value="${settings.storeName}" oninput="settings.storeName=this.value;save()" class="w-full border rounded-xl px-4 py-3 text-sm"><label class="text-[11px] font-bold uppercase text-zinc-500">Address</label><input value="${settings.address}" oninput="settings.address=this.value;save()" class="w-full border rounded-xl px-4 py-3 text-sm"><label class="text-[11px] font-bold uppercase text-zinc-500">Phone</label><input value="${settings.phone}" oninput="settings.phone=this.value;save()" class="w-full border rounded-xl px-4 py-3 text-sm"><label class="text-[11px] font-bold uppercase text-zinc-500">Receipt Footer</label><input value="${settings.receiptFooter}" oninput="settings.receiptFooter=this.value;save()" class="w-full border rounded-xl px-4 py-3 text-sm"></div></div><div class="space-y-6"><div class="bg-white border rounded-[24px] p-6"><div class="font-bold mb-4">Default Courier</div><select onchange="settings.courier=this.value;wbForm.courier=this.value;save()" class="w-full border rounded-xl px-4 py-3 text-sm">${['J&T Express','Flash Express','LBC','Shopee Xpress','TikTok Shop','Lazada Express','Ninja Van','Other'].map(c=>`<option ${settings.courier===c?'selected':''}>${c}</option>`).join('')}</select><div class="mt-6 text-[12px] leading-relaxed text-zinc-600"><b>GitHub Pages Deploy:</b><br>1. Save this file as index.html<br>2. Create new repo sa GitHub<br>3. Upload index.html<br>4. Settings > Pages > main/root > Save<br>5. Live na!</div></div><div class="bg-white border rounded-[24px] p-6"><div class="font-bold mb-3">Danger Zone</div><button onclick="exportData()" class="w-full border py-3 rounded-xl text-sm font-medium">Export All Data JSON</button><button onclick="if(confirm('Reset lahat?')){localStorage.clear();location.reload()}" class="w-full bg-red-50 text-red-600 py-3 rounded-xl text-sm font-bold mt-2">Reset Everything</button></div></div></div></div>`;
}

function receiptModal(){return `<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 grid place-items-center p-4"><div class="bg-white rounded-[24px] w-full max-w-[380px] overflow-hidden"><div id="receipt" class="p-7 mono text-[12px]"><div class="text-center border-b border-dashed border-zinc-300 pb-5"><div class="font-bold text-[18px] font-sans">${settings.storeName}</div><div class="text-zinc-600 mt-1">${settings.address}</div><div>${settings.phone}</div><div class="mt-3 text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full">${new Date().toLocaleString()}</div></div><div class="py-4 space-y-2">${receipt.map(i=>`<div class="flex justify-between"><span>${i.name} x${i.qty}</span><span class="font-bold">₱${i.price*i.qty}</span></div>`).join('')}</div><div class="border-t border-dashed pt-4 flex justify-between font-bold text-[15px] font-sans"><span>TOTAL</span><span>₱${receipt.reduce((s,i)=>s+i.price*i.qty,0)}</span></div><div class="text-center mt-8 text-[11px] font-sans leading-relaxed">${settings.receiptFooter}<br><span class="mono text-[10px] mt-2 inline-block bg-zinc-900 text-white px-2 py-1 rounded-full">${receipt[0]?.orderId||'POS-'+Date.now()}</span></div></div><div class="p-4 grid grid-cols-2 gap-2 bg-zinc-50"><button onclick="printEl('receipt')" class="bg-black text-white py-3 rounded-xl font-bold text-sm">Print Receipt</button><button onclick="receipt=null;render()" class="bg-white border py-3 rounded-xl font-bold text-sm">Close</button></div></div></div>`}

function wbPrintModal(){
  const w=wbPrint;
  return `<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 grid place-items-center p-4" onclick="if(event.target===this){wbPrint=null;render()}">
  <div class="bg-white rounded-[20px] w-full max-w-[520px] overflow-hidden shadow-2xl">
    <div id="waybill" class="p-6">
      <div class="flex justify-between items-start">
        <div><div class="font-black text-[20px] tracking-tight">${w.courier}</div><div class="text-[10px] tracking-[0.15em] uppercase text-zinc-500 mt-1">Waybill • 100x150mm • Handle with Care</div></div>
        <div class="text-right"><div class="bg-black text-white px-3 py-1.5 rounded-full text-[11px] font-black tracking-wider">${w.cod>0?'COD':'NON-COD'}</div><div class="mono text-[10px] mt-2">${w.orderId}</div></div>
      </div>
      <div class="mt-5 border-[2.5px] border-black rounded-[14px] p-3">
        <svg id="barcode-${w.tracking}" class="w-full h-[70px]"></svg>
        <div class="mono text-[11px] text-center tracking-[0.2em] font-bold mt-1">${w.tracking}</div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div class="border border-zinc-200 rounded-xl p-3.5"><div class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">From / Sender</div><div class="font-bold text-[13px] mt-2">${settings.storeName}</div><div class="text-[11px] text-zinc-600 leading-snug mt-1">${settings.address}<br>${settings.phone}</div></div>
        <div class="border-2 border-black rounded-xl p-3.5 bg-[#fafafa]"><div class="text-[10px] font-black uppercase tracking-wider">To / Receiver</div><div class="font-black text-[13px] mt-2">${w.receiverName}</div><div class="text-[11px] font-bold">${w.receiverPhone}</div><div class="text-[11px] text-zinc-700 leading-snug mt-1.5">${w.receiverAddr}</div></div>
      </div>
      <div class="mt-3 border border-zinc-200 rounded-xl p-3.5 flex justify-between items-center">
        <div><div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider">Item & Weight</div><div class="text-[12px] font-medium mt-1">${w.itemDesc} x${w.qty} • ${w.weight}</div><div class="text-[10px] text-zinc-500 mt-1">${w.note||'Please check before receiving.'}</div></div>
        <div class="text-right"><div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider">COD Amount</div><div class="font-black text-[22px]">₱${w.cod}</div></div>
      </div>
      <div class="mt-3 flex gap-3 items-center"><div id="qrcode-${w.tracking}" class="w-[64px] h-[64px] border rounded-xl p-1 grid place-items-center"></div><div class="text-[10px] leading-relaxed text-zinc-500">Scan QR for tracking<br><b class="text-zinc-900">${w.tracking}</b><br>Powered by Tindahan POS</div></div>
    </div>
    <div class="p-4 grid grid-cols-2 gap-2 bg-zinc-50 border-t"><button onclick="printEl('waybill')" class="bg-black text-white py-3.5 rounded-xl font-bold text-sm">Print Waybill 100x150</button><button onclick="wbPrint=null;render()" class="bg-white border py-3.5 rounded-xl font-bold text-sm">Close</button></div>
  </div></div>`;
}

function wbFormModal(){
  return `<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 grid place-items-center p-4"><div class="bg-white rounded-[24px] w-full max-w-[520px] p-7 max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><div class="font-bold text-[18px]">New Waybill</div><div class="text-[11px] bg-zinc-100 px-2.5 py-1 rounded-full mono">${wbForm.orderId}</div></div><div class="grid gap-3 mt-6"><div class="grid grid-cols-2 gap-3"><input id="w_tracking" value="${wbForm.tracking}" class="border rounded-xl px-4 py-3 text-sm mono" placeholder="Tracking No"><select id="w_courier" class="border rounded-xl px-4 py-3 text-sm">${['J&T Express','Flash Express','LBC','Shopee Xpress','TikTok Shop','Lazada Express','Ninja Van','Other'].map(c=>`<option ${wbForm.courier===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="grid grid-cols-2 gap-3"><input id="w_rname" value="${wbForm.receiverName}" placeholder="Receiver Name *" class="border rounded-xl px-4 py-3 text-sm"><input id="w_rphone" value="${wbForm.receiverPhone}" placeholder="Phone *" class="border rounded-xl px-4 py-3 text-sm"></div><textarea id="w_raddr" placeholder="Complete Address *" class="w-full border rounded-xl px-4 py-3 text-sm h-[70px] resize-none">${wbForm.receiverAddr}</textarea><div class="grid grid-cols-[1fr_80px] gap-3"><input id="w_item" value="${wbForm.itemDesc}" placeholder="Item description" class="border rounded-xl px-4 py-3 text-sm"><input id="w_qty" value="${wbForm.qty}" type="number" class="border rounded-xl px-4 py-3 text-sm" placeholder="Qty"></div><div class="grid grid-cols-2 gap-3"><input id="w_cod" value="${wbForm.cod}" type="number" placeholder="COD Amount ₱" class="border rounded-xl px-4 py-3 text-sm"><input id="w_weight" value="${wbForm.weight}" placeholder="Weight" class="border rounded-xl px-4 py-3 text-sm"></div><input id="w_note" value="${wbForm.note}" placeholder="Note (optional)" class="w-full border rounded-xl px-4 py-3 text-sm"></div><div class="grid grid-cols-2 gap-3 mt-7"><button onclick="saveWB()" class="bg-black text-white py-3.5 rounded-xl font-bold text-sm">Save & Print</button><button onclick="wbFormOpen=false;render()" class="border py-3.5 rounded-xl font-bold text-sm">Cancel</button></div></div></div>`;
}

function gitModal(){return `<div class="fixed inset-0 bg-black/50 backdrop-blur z-[60] grid place-items-center p-4"><div class="bg-white rounded-[24px] p-7 w-full max-w-[480px]"><div class="font-bold text-lg">Paano i-upload sa GitHub (Unli Edit)</div><ol class="list-decimal ml-5 mt-4 text-[13px] space-y-3 leading-relaxed"><li>I-save mo itong file bilang <b>index.html</b> (Ctrl+S)</li><li>Punta sa <a href="https://github.com/new" target="_blank" class="underline font-bold">github.com/new</a> → Create repository → name: <b>printwaybill-clone</b> → Public → Create</li><li>Click <b>Add file → Upload files</b> → i-drag mo index.html + README.md</li><li>Punta sa <b>Settings → Pages</b> → Source: <b>main</b> / <b>root</b> → Save</li><li>After 1-2 mins, live na sa <b>username.github.io/printwaybill-clone</b></li><li>Para mag-edit: click mo file → pencil icon → edit → Commit changes. Unli!</li></ol><button onclick="showGitModal=false;render()" class="mt-6 w-full bg-black text-white py-3 rounded-xl font-bold text-sm">Gets!</button></div></div>`}

// Actions
function addCart(id){let p=products.find(x=>x.id===id),f=cart.find(x=>x.id===id);f?f.qty++:cart.push({...p,qty:1});render()}
function openWBFromCart(){if(!cust.name||!cust.phone||!cust.address){alert('Lagay mo muna Name, Phone, Address');return}wbForm.receiverName=cust.name;wbForm.receiverPhone=cust.phone;wbForm.receiverAddr=cust.address;wbForm.itemDesc=cart.map(c=>c.name).join(', ');wbForm.qty=cart.reduce((s,c)=>s+c.qty,0);wbFormOpen=true;render()}
function newWB(){wbForm={orderId:'OD-'+Math.random().toString(36).slice(2,8).toUpperCase(),tracking:'JT'+Math.floor(Math.random()*9e9+1e9),courier:settings.courier,receiverName:cust.name,receiverPhone:cust.phone,receiverAddr:cust.address,itemDesc:'',qty:1,cod:0,weight:'0.5 kg',note:''};wbFormOpen=true;render()}
function saveWB(){const w={orderId:wbForm.orderId,tracking:document.getElementById('w_tracking').value,courier:document.getElementById('w_courier').value,receiverName:document.getElementById('w_rname').value,receiverPhone:document.getElementById('w_rphone').value,receiverAddr:document.getElementById('w_raddr').value,itemDesc:document.getElementById('w_item').value,qty:+document.getElementById('w_qty').value||1,cod:+document.getElementById('w_cod').value||0,weight:document.getElementById('w_weight').value,note:document.getElementById('w_note').value};if(!w.receiverName||!w.receiverPhone){alert('Name & Phone required');return}waybills.unshift(w);wbFormOpen=false;wbPrint=w;cart=[];save()}
function saveProd(){const name=document.getElementById('pn').value,price=+document.getElementById('pp').value,stock=+document.getElementById('ps').value||0,sku=document.getElementById('psku').value||'SKU-'+Date.now(),emoji=document.getElementById('pemo').value||'📦';if(!name||!price){alert('Name & price required');return}if(editProd._new)products.unshift({id:Date.now()+'',name,price,stock,sku,emoji,cat:document.getElementById('pcat').value});else{let i=products.findIndex(x=>x.id===editProd.id);products[i]={...products[i],name,price,stock,sku,emoji}}editProd=null;save()}
function dupWB(i){let w={...waybills[i],tracking:'JT'+Math.floor(Math.random()*9e9+1e9),orderId:'OD-'+Math.random().toString(36).slice(2,8).toUpperCase()};waybills.unshift(w);save()}
function doReceipt(){if(!cart.length)return;receipt=[...cart];receipt[0].orderId='POS-'+Date.now();save();cart=[];render()}
function printEl(id){let el=document.getElementById(id),pa=document.getElementById('print-area');pa.innerHTML=el.outerHTML;pa.classList.remove('hidden');window.print();setTimeout(()=>pa.classList.add('hidden'),500)}
function exportData(){let blob=new Blob([JSON.stringify({products,waybills,settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tindahan-backup.json';a.click()}
function initBarcodes(){if(typeof JsBarcode!=='undefined'&&wbPrint){try{JsBarcode('#barcode-'+wbPrint.tracking,wbPrint.tracking,{format:'CODE128',width:2,height:60,displayValue:false,margin:0})}catch(e){}} if(wbPrint&&document.getElementById('qrcode-'+wbPrint.tracking)){let qrEl=document.getElementById('qrcode-'+wbPrint.tracking);qrEl.innerHTML='';new QRCode(qrEl,{text:wbPrint.tracking,width:56,height:56})}}
let showGitModal=false;let filterCat='All';
render();
</script>
